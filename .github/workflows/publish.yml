name: publish

# Builds every platform of one CLI release and uploads binaries, checksums and
# build provenance. Called by release.yml; run manually to retry a release.
on:
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: "CLI release tag, e.g. hello-go-v0.1.0"
        type: string
        required: true

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - id: meta
        run: |
          [[ "$TAG" =~ ^([a-z0-9-]+)-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "not a CLI tag: $TAG"; exit 1; }
          echo "tool=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "zig=$(cat .zig-version)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ steps.meta.outputs.zig }}
      - name: Build all platforms
        run: go run ./cmd/repo build --tool "${{ steps.meta.outputs.tool }}" --all-platforms --tag "$TAG"
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/${{ steps.meta.outputs.tool }}/*
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/${{ steps.meta.outputs.tool }}/* --clobber
